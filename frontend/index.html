<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Finance Tracker</title>
    <style>
      body { font-family: system-ui, Arial, sans-serif; background:#0b1220; color:#e7ecf7; margin:0; }
      .container { max-width: 900px; margin: 0 auto; padding: 24px; }
      .card { background:#121a2b; border:1px solid #22324e; border-radius:16px; padding:16px; box-shadow: 0 10px 24px rgba(0,0,0,0.25); }
      .row { display:flex; gap:16px; flex-wrap:wrap; }
      .col { flex:1; min-width:260px; }
      input, select, button { width:100%; padding:10px; border-radius:10px; border:1px solid #324566; background:#0f1625; color:#e7ecf7; }
      button { cursor:pointer; font-weight:600; }
      table { width:100%; border-collapse: collapse; }
      th, td { padding:10px; border-bottom:1px solid #22324e; text-align:left; }
      .summary { display:flex; gap:12px; flex-wrap:wrap; }
      .pill { padding:8px 12px; border-radius:999px; background:#16233a; border:1px solid #22324e; }
      .income { color:#45d48a; } .expense { color:#ff7c7c; }
      .title { font-size:20px; font-weight:700; margin-bottom:12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
